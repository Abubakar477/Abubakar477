<svg xmlns="http://www.w3.org/2000/svg" width="480" height="110" viewBox="0 0 480 110" role="img" aria-label="Most Used Languages" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0.5" y="0.5" width="479" height="109" rx="10" fill="#0d1117" stroke="#30363d"/>
  
  <text x="22" y="32" font-size="14" font-weight="700" fill="#38bdf8">Most Used Languages</text>
  <text x="458" y="32" font-size="11" text-anchor="end" fill="#8b949e">top languages</text>
  
  <!-- Language Progress Bar -->
  <g transform="translate(22, 48)">
    <clipPath id="bar-clip">
      <rect x="0" y="0" width="436" height="10" rx="5"/>
    </clipPath>
    <g clip-path="url(#bar-clip)">
      <rect x="0" width="160" height="10" fill="#3572A5"/>
      <rect x="160" width="120" height="10" fill="#f34b7d"/>
      <rect x="280" width="86" height="10" fill="#f1e05a"/>
      <rect x="366" width="70" height="10" fill="#e34c26"/>
    </g>
  </g>
  
  <!-- Legend -->
  <g transform="translate(22, 82)" font-size="11.5" fill="#c9d1d9">
    <circle cx="5" cy="5" r="4.5" fill="#3572A5"/>
    <text x="14" y="9">Python <tspan fill="#8b949e">38%</tspan></text>
    
    <circle cx="115" cy="5" r="4.5" fill="#f34b7d"/>
    <text x="124" y="9">C++ <tspan fill="#8b949e">28%</tspan></text>
    
    <circle cx="210" cy="5" r="4.5" fill="#f1e05a"/>
    <text x="219" y="9">JavaScript <tspan fill="#8b949e">20%</tspan></text>
    
    <circle cx="330" cy="5" r="4.5" fill="#e34c26"/>
    <text x="339" y="9">HTML/CSS <tspan fill="#8b949e">14%</tspan></text>
  </g>
</svg>
